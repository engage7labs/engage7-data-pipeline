name: tests
on:
  push:
    branches:
      - main
      - "release/**"
  pull_request: {}

permissions:
  contents: read

# Synthetic tests complement the data-dependent ETL audits.
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install synthetic-test dependencies
        run: python -m pip install "pytest>=8.0,<9" "pandas>=2.2,<3"

      - name: Run synthetic IO and release-guard tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_io_guards.py tests/test_release_guard.py
