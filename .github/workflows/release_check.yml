name: Release Check (dry-run)
on:
  pull_request:
  push:
    branches: [ v4-main ]

permissions:
  contents: read

jobs:
  release-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect existing release-draft plan
        run: |
          set -e
          make --dry-run release-draft NEXT_TAG=v0.0.0-test
